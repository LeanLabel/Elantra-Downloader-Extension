<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f8f9fa;
      margin: 0;
    }
    h3 {
      margin: 0 0 5px 0;
      color: #1a73e8;
      font-size: 18px;
    }
    .sub {
      color: #666;
      font-size: 12px;
      margin-bottom: 15px;
    }
    #status {
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      margin: 10px 0;
      min-height: 50px;
      font-size: 13px;
      word-break: break-word;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #1557b0;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .row {
      display: flex;
      align-items: center;
      margin: 8px 0 12px 0;
    }
    .row input {
      margin-right: 8px;
      width: 16px;
      height: 16px;
    }
    .row label {
      font-size: 13px;
      color: #333;
    }
    .footer {
      font-size: 11px;
      color: #999;
      margin-top: 12px;
      text-align: center;
    }
    .badge-hint {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 8px;
      color: #856404;
    }
  </style>
</head>
<body>
  <h3>📂 Elentra Downloader</h3>
  <div class="sub">Downloads all files from the current event page.</div>
  
  <div class="row">
    <input type="checkbox" id="organizeCheck" checked>
    <label for="organizeCheck">Organize into folders (e.g., "2.1 Cytoskeleton")</label>
  </div>
  
  <button id="downloadBtn">🔍 Scan & Download</button>
  <div id="status">Ready. Open an Elentra event page.</div>
  <div class="badge-hint">💡 The extension badge shows progress: <strong>12/25</strong></div>
  <div class="footer">Files save to your Chrome Downloads folder.</div>
  <script src="popup.js"></script>
</body>
</html>
